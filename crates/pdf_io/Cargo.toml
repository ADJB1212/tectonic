lints.workspace = true

[package]
name = "tectonic_pdf_io"
version = "0.0.0-dev.0"  # assigned with cranko (see README)
authors = ["Peter Williams <peter@newton.cx>"]
description = """
Xdvipdfmx's PDF, XDV, and image I/O implementation in Rust, with a C API.
"""
homepage = "https://tectonic-typesetting.github.io/"
documentation = "https://docs.rs/tectonic_pdf_io"
repository = "https://github.com/tectonic-typesetting/tectonic/"
readme = "README.md"
license = "MIT"
edition = "2024"
links = "tectonic_pdf_io"

[dependencies]
aes = { version = "0.9", default-features = false }
btoa = { version = "0.1", default-features = false, features = ["alloc"] }
faster-hex = { version = "1", default-features = false, features = ["std"] }
libc = { version = "0.2", default-features = false, features = ["std"] }
md-5 = { version = "0.11", default-features = false, features = ["alloc", "oid"] }
rayon = { version = "1.12", default-features = false }
rand_mt = { version = "6.1", default-features = false }
read-fonts = { version = "0.46", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc", "oid"] }
tectonic_bridge_core = { path = "../bridge_core", version = "0.0.0-dev.0" }
tectonic_bridge_flate = { path = "../bridge_flate", version = "0.0.0-dev.0" }
tectonic_bridge_png = { path = "../bridge_png", version = "0.0.0-dev.0" }

[build-dependencies]
cc = { version = "1.8", features = ["parallel"] }

