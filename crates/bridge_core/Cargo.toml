lints.workspace = true

[package]
name = "tectonic_bridge_core"
version = "0.0.0-dev.0"  # assigned with cranko (see README)
authors = ["Peter Williams <peter@newton.cx>"]
description = """
Exposing core backend APIs to the Tectonic C/C++ code.
"""
homepage = "https://tectonic-typesetting.github.io/"
documentation = "https://docs.rs/tectonic_bridge_core"
repository = "https://github.com/tectonic-typesetting/tectonic/"
readme = "README.md"
license = "MIT"
edition = "2024"
links = "tectonic_bridge_core"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libc = { version = "0.2", default-features = false, features = ["std"] }
md-5 = { version = "0.11", default-features = false, features = ["alloc", "oid"] }
serde = { version = "1", default-features = false, features = ["std", "derive"], }
serde_json = { version = "1", default-features = false, features = ["std"] }
tectonic_errors = { path = "../errors", version = "0.0.0-dev.0" }
tectonic_io_base = { path = "../io_base", version = "0.0.0-dev.0" }
tectonic_status_base = { path = "../status_base", version = "0.0.0-dev.0" }

[build-dependencies]
cc = { version = "^1.0.66", features = ["parallel"] }
